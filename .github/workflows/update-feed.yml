name: Update Podcast Feed

on:
  schedule:
    - cron: '7 3 * * 2-6'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Diagnose verbinding
        continue-on-error: true
        run: |
          URL='https://robstenders.nl/podcast/9/index'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          FMT='http=%{http_code} versie=%{http_version} bytes=%{size_download} totaal=%{time_total}s\n'

          echo "=== Tijd (UTC) ==="
          date -u
          echo ""
          echo "=== DNS: IPv4-adressen ==="
          getent ahostsv4 robstenders.nl || echo "GEEN IPv4-adres gevonden"
          echo ""
          echo "=== DNS: IPv6-adressen ==="
          getent ahostsv6 robstenders.nl || echo "GEEN IPv6-adres gevonden"
          echo ""
          echo "=== A) standaard (HTTP/2, IPv6) ==="
          curl -sS -o /dev/null -w "$FMT" --max-time 30 -A "$UA" "$URL" || echo "exit $?"
          echo ""
          echo "=== B) geforceerd HTTP/1.1 ==="
          curl -sS -o /dev/null -w "$FMT" --max-time 30 --http1.1 -A "$UA" "$URL" || echo "exit $?"
          echo ""
          echo "=== C) geforceerd IPv4 ==="
          curl -sS -o /dev/null -w "$FMT" --max-time 30 -4 -A "$UA" "$URL" || echo "exit $?"
          echo ""
          echo "=== D) IPv4 + HTTP/1.1 ==="
          curl -sS -o /dev/null -w "$FMT" --max-time 30 -4 --http1.1 -A "$UA" "$URL" || echo "exit $?"

      - name: Generate feed
        run: node generate-feed.js

      - name: Commit and push if changed
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add feed.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update podcast feed" && git push)
